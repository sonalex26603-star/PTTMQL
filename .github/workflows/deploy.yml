name: Deploy .NET 10 MVC to MonsterASP.net

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish project
        shell: bash
        run: |
          PROJECT=$(find . -name "*.csproj" | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "No .csproj file found."
            exit 1
          fi
          dotnet publish "$PROJECT" -c Release -o ./publish

      - name: Stop Server
        shell: bash
        run: |
          echo "<html><body><h1>Updating...</h1></body></html>" > app_offline.htm
          curl -sS --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T app_offline.htm "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm"

      - name: Deploy App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./publish/
          server-dir: /wwwroot/
          security: loose
          exclude: |
            **/app_offline.htm

      - name: Start Server
        if: always()
        shell: bash
        run: |
          curl -sS --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/" -Q "-DELE /wwwroot/app_offline.htm" || true